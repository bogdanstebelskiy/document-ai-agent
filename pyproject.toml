[project]
name = "document-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bogdanstebelskiy", email = "bogdanstebelskiy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
document-agent = "document_agent.cli:app"
stats = "document_agent.cli:stats"
ingest = "document_agent.cli:ingest"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
